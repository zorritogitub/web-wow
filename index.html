<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoFrost - Tienda de Ventas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f7fa;
            color: #1a2332;
        }

        .container-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, #000000 0%, #0052cc 100%);
            color: white;
            padding: 1rem 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-header {
            display: flex;
            gap: 1rem;
        }

        .nav-header button {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-header button.active {
            background: white;
            color: #0052cc;
        }

        .nav-header button:hover {
            background: white;
            color: #0052cc;
        }

        .cart-badge {
            background: #ff4444;
            border-radius: 50%;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 0.3rem;
        }

        /* MONEDA SELECTOR */
        .currency-selector {
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: white;
        }

        .currency-selector select {
            background: transparent;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        /* ADMIN PANEL */
        #adminSection {
            display: none;
            padding: 2rem 0;
        }

        .admin-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: #000;
        }

        .admin-form {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #000;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 0.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: border 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0052cc;
        }

        .form-group textarea {
            grid-column: 1 / -1;
            resize: vertical;
            min-height: 100px;
        }

        .btn-primary {
            background: #0052cc;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #003d99;
            transform: translateY(-2px);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        /* TIENDA */
        #tiendaSection {
            padding: 2rem 0;
        }

        .tienda-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-align: center;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #e6f0ff, #f0f8ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-image-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .product-info {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #000;
        }

        .product-desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.8rem;
            flex-grow: 1;
        }

        .product-prices {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .price-item {
            background: #f0f0f0;
            padding: 0.6rem;
            border-radius: 8px;
            text-align: center;
        }

        .price-label {
            font-weight: 600;
            color: #0052cc;
            font-size: 0.75rem;
        }

        .price-value {
            font-weight: 700;
            color: #000;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            flex: 1;
            padding: 0.6rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-add {
            background: #0052cc;
            color: white;
        }

        .btn-add:hover {
            background: #003d99;
        }

        .btn-delete {
            background: #ff4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dd0000;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: #f0f0f0;
            border-radius: 8px;
            padding: 0.3rem;
        }

        .quantity-selector button {
            background: transparent;
            border: none;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-weight: 700;
        }

        .quantity-selector input {
            width: 40px;
            text-align: center;
            border: none;
            background: transparent;
        }

        /* CARRITO */
        #cartSection {
            display: none;
            padding: 2rem 0;
        }

        .cart-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        .cart-items {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .cart-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 1rem;
            align-items: flex-start;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e6f0ff, #f0f8ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-name {
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .cart-item-price {
            color: #0052cc;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .cart-item-remove {
            background: #ff4444;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .cart-empty {
            text-align: center;
            padding: 2rem;
            color: #999;
        }

        .cart-summary {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .summary-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid #e0e0e0;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .btn-checkout {
            width: 100%;
            margin-top: 1rem;
            background: #00aa00;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-checkout:hover {
            background: #008800;
        }

        .btn-checkout:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .cart-container {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .form-group {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: 1;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .header-content {
                flex-direction: column;
            }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ddd;
        }
    </style>
</head>
<body>

<header>
    <div class="container-main">
        <div class="header-content">
            <div class="logo">
                <i class="fa fa-store"></i> EcoFrost Store
            </div>
            <div class="nav-header">
                <button id="btnTienda" class="nav-btn active" data-section="tienda">
                    <i class="fa fa-shop"></i> Tienda
                </button>
                <button id="btnAdmin" class="nav-btn" data-section="admin">
                    <i class="fa fa-cog"></i> Admin
                </button>
                <button id="btnCart" class="nav-btn" data-section="cart">
                    <i class="fa fa-shopping-cart"></i> Carrito <span class="cart-badge" id="cartCount">0</span>
                </button>
            </div>
            <div class="currency-selector">
                <label style="color: white; margin: 0; margin-right: 0.5rem;">Moneda:</label>
                <select id="currencySelect">
                    <option value="USD">USD $</option>
                    <option value="CUP">CUP ₱</option>
                    <option value="ZELLE">ZELLE $</option>
                </select>
            </div>
        </div>
    </div>
</header>

<!-- ADMIN SECTION -->
<div id="adminSection" class="container-main">
    <h1 class="admin-title"><i class="fa fa-cog"></i> Panel de Administración</h1>
    
    <div class="admin-form">
        <h2 style="margin-bottom: 1.5rem;">Agregar Nuevo Producto</h2>
        <form id="productForm">
            <div class="form-group">
                <div>
                    <label>Nombre del Producto</label>
                    <input type="text" id="productName" required>
                </div>
                <div>
                    <label>Icono (Font Awesome)</label>
                    <input type="text" id="productIcon" placeholder="ej: fa-snowflake" value="fa-box">
                </div>
            </div>
            <div class="form-group">
                <label>URL de la Imagen del Producto</label>
                <input type="url" id="productImage" placeholder="ej: https://ejemplo.com/imagen.jpg">
            </div>
            <div class="form-group full">
                <label>Descripción</label>
                <textarea id="productDesc" required></textarea>
            </div>
            <div class="form-group">
                <div>
                    <label>Precio USD ($)</label>
                    <input type="number" id="productPriceUSD" step="0.01" required>
                </div>
                <div>
                    <label>Precio CUP (₱)</label>
                    <input type="number" id="productPriceCUP" step="0.01" required>
                </div>
                <div>
                    <label>Precio ZELLE ($)</label>
                    <input type="number" id="productPriceZELLE" step="0.01" required>
                </div>
            </div>
            <button type="submit" class="btn-primary">
                <i class="fa fa-plus"></i> Agregar Producto
            </button>
        </form>
    </div>

    <h2 style="margin: 2rem 0 1rem 0; font-size: 1.5rem; font-weight: 700;">Productos Existentes</h2>
    <div class="products-grid" id="adminProducts"></div>
</div>

<!-- TIENDA SECTION -->
<div id="tiendaSection" class="container-main">
    <h1 class="tienda-title"><i class="fa fa-bag-shopping"></i> Nuestra Tienda</h1>
    <div class="products-grid" id="tiendaProducts"></div>
</div>

<!-- CART SECTION -->
<div id="cartSection" class="container-main">
    <h1 class="tienda-title"><i class="fa fa-shopping-cart"></i> Mi Carrito</h1>
    <div class="cart-container">
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-summary">
            <div class="summary-title">Resumen</div>
            <div class="summary-line">
                <span>Subtotal:</span>
                <span id="subtotalDisplay">$0.00</span>
            </div>
            <div class="summary-line">
                <span>Moneda:</span>
                <span id="currencyDisplay">USD</span>
            </div>
            <div class="summary-total">
                <span>Total:</span>
                <span id="totalDisplay">$0.00</span>
            </div>
            <button class="btn-checkout" id="btnCheckout">
                <i class="fa fa-whatsapp"></i> Comprar por WhatsApp
            </button>
        </div>
    </div>
</div>

<script>
    const WHATSAPP_NUMBER = '5351526274'; // +53 51526274
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let currentCurrency = localStorage.getItem('currency') || 'USD';

    // Cargar productos por defecto si no hay
    if(products.length === 0) {
        products = [
            {
                id: 1,
                name: "Nevera Solar Pro",
                icon: "fa-snowflake",
                image: "https://images.unsplash.com/photo-1584568694244-14fbdf83bd30?w=400&h=300&fit=crop",
                desc: "Nevera de alta eficiencia A+++, 320L, funciona 24h con batería solar.",
                prices: {USD: 1249, CUP: 32000, ZELLE: 1249}
            },
            {
                id: 2,
                name: "Panel Solar 550W",
                icon: "fa-sun",
                image: "https://images.unsplash.com/photo-1509391366360-2e938d440220?w=400&h=300&fit=crop",
                desc: "Monocristalino PERC, resistencia a granizo y eficiencia 22.5%.",
                prices: {USD: 289, CUP: 7500, ZELLE: 289}
            },
            {
                id: 3,
                name: "Kit Autoconsumo",
                icon: "fa-battery-full",
                image: "https://images.unsplash.com/photo-1578926313433-ca06b6a6b771?w=400&h=300&fit=crop",
                desc: "2 paneles 550W + nevera eficiente + inversor/cargador 1.5kW.",
                prices: {USD: 2390, CUP: 62000, ZELLE: 2390}
            }
        ];
        localStorage.setItem('products', JSON.stringify(products));
    }

    // Event Listeners
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            showSection(e.target.closest('button').dataset.section);
        });
    });

    document.getElementById('currencySelect').addEventListener('change', (e) => {
        currentCurrency = e.target.value;
        localStorage.setItem('currency', currentCurrency);
        renderTienda();
        updateCartDisplay();
    });

    document.getElementById('productForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newProduct = {
            id: Date.now(),
            name: document.getElementById('productName').value,
            icon: document.getElementById('productIcon').value,
            image: document.getElementById('productImage').value,
            desc: document.getElementById('productDesc').value,
            prices: {
                USD: parseFloat(document.getElementById('productPriceUSD').value),
                CUP: parseFloat(document.getElementById('productPriceCUP').value),
                ZELLE: parseFloat(document.getElementById('productPriceZELLE').value)
            }
        };
        products.push(newProduct);
        localStorage.setItem('products', JSON.stringify(products));
        document.getElementById('productForm').reset();
        document.getElementById('productIcon').value = 'fa-box';
        renderAdmin();
        showNotification('✅ Producto agregado exitosamente');
    });

    document.getElementById('btnCheckout').addEventListener('click', () => {
        if(cart.length === 0) return;
        
        let message = '*Pedido de Compra - EcoFrost* 🛒\n\n';
        let total = 0;
        
        cart.forEach(item => {
            const product = products.find(p => p.id === item.id);
            const price = product.prices[currentCurrency];
            const subtotal = price * item.quantity;
            total += subtotal;
            
            message += `*${product.name}*\n`;
            message += `Cantidad: ${item.quantity}\n`;
            message += `Precio: ${price} ${currentCurrency}\n`;
            message += `Subtotal: ${(subtotal).toFixed(2)} ${currentCurrency}\n\n`;
        });
        
        message += `---\n*Total: ${total.toFixed(2)} ${currentCurrency}*\n`;
        message += `Moneda: ${currentCurrency}`;
        
        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
        window.open(whatsappUrl, '_blank');
    });

    function showSection(section) {
        document.getElementById('adminSection').style.display = section === 'admin' ? 'block' : 'none';
        document.getElementById('tiendaSection').style.display = section === 'tienda' ? 'block' : 'none';
        document.getElementById('cartSection').style.display = section === 'cart' ? 'block' : 'none';
        
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.section === section);
        });

        if(section === 'tienda') renderTienda();
        if(section === 'admin') renderAdmin();
        if(section === 'cart') updateCartDisplay();
    }

    function renderTienda() {
        const container = document.getElementById('tiendaProducts');
        container.innerHTML = products.map(product => `
            <div class="product-card">
                <div class="product-image">
                    ${product.image ? `<img src="${product.image}" alt="${product.name}">` : '<div style="font-size: 3rem;">📦</div>'}
                    <div class="product-image-icon">
                        <i class="fa ${product.icon || 'fa-box'}"></i>
                    </div>
                </div>
                <div class="product-info">
                    <div class="product-name">${product.name}</div>
                    <div class="product-desc">${product.desc}</div>
                    <div class="product-prices">
                        <div class="price-item">
                            <div class="price-label">USD</div>
                            <div class="price-value">$${product.prices.USD.toFixed(2)}</div>
                        </div>
                        <div class="price-item">
                            <div class="price-label">CUP</div>
                            <div class="price-value">₱${product.prices.CUP.toFixed(2)}</div>
                        </div>
                        <div class="price-item">
                            <div class="price-label">ZELLE</div>
                            <div class="price-value">$${product.prices.ZELLE.toFixed(2)}</div>
                        </div>
                    </div>
                    <div class="product-actions">
                        <div class="quantity-selector">
                            <button type="button" onclick="changeQty(${product.id}, -1)">-</button>
                            <input type="number" id="qty-${product.id}" value="1" min="1">
                            <button type="button" onclick="changeQty(${product.id}, 1)">+</button>
                        </div>
                        <button class="btn-small btn-add" onclick="addToCart(${product.id})">
                            <i class="fa fa-shopping-cart"></i> Agregar
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderAdmin() {
        const container = document.getElementById('adminProducts');
        if(products.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fa fa-inbox"></i><p>No hay productos</p></div>';
            return;
        }
        
        container.innerHTML = products.map(product => `
            <div class="product-card">
                <div class="product-image">
                    ${product.image ? `<img src="${product.image}" alt="${product.name}">` : '<div style="font-size: 3rem;">📦</div>'}
                    <div class="product-image-icon">
                        <i class="fa ${product.icon || 'fa-box'}"></i>
                    </div>
                </div>
                <div class="product-info">
                    <div class="product-name">${product.name}</div>
                    <div class="product-desc">${product.desc}</div>
                    <div class="product-prices">
                        <div class="price-item">
                            <div class="price-label">USD</div>
                            <div class="price-value">$${product.prices.USD}</div>
                        </div>
                        <div class="price-item">
                            <div class="price-label">CUP</div>
                            <div class="price-value">₱${product.prices.CUP}</div>
                        </div>
                        <div class="price-item">
                            <div class="price-label">ZELLE</div>
                            <div class="price-value">$${product.prices.ZELLE}</div>
                        </div>
                    </div>
                    <div class="product-actions">
                        <button class="btn-small btn-delete" onclick="deleteProduct(${product.id})">
                            <i class="fa fa-trash"></i> Eliminar
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        const qty = parseInt(document.getElementById(`qty-${productId}`).value);
        
        const existingItem = cart.find(item => item.id === productId);
        if(existingItem) {
            existingItem.quantity += qty;
        } else {
            cart.push({ id: productId, quantity: qty });
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartBadge();
        
        // Mostrar notificación
        showNotification(`${product.name} agregado al carrito ✓`);
    }

    function changeQty(productId, delta) {
        const input = document.getElementById(`qty-${productId}`);
        const newVal = Math.max(1, parseInt(input.value) + delta);
        input.value = newVal;
    }

    function removeFromCart(productId) {
        cart = cart.filter(item => item.id !== productId);
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartBadge();
        updateCartDisplay();
    }

    function deleteProduct(productId) {
        if(confirm('¿Eliminar este producto?')) {
            products = products.filter(p => p.id !== productId);
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('products', JSON.stringify(products));
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            renderAdmin();
            showNotification('🗑️ Producto eliminado');
        }
    }

    function updateCartBadge() {
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartCount').textContent = count;
    }

    function updateCartDisplay() {
        const container = document.getElementById('cartItems');
        
        if(cart.length === 0) {
            container.innerHTML = '<div class="cart-empty"><i class="fa fa-inbox"></i><p>Tu carrito está vacío</p></div>';
            document.getElementById('btnCheckout').disabled = true;
        } else {
            container.innerHTML = cart.map(item => {
                const product = products.find(p => p.id === item.id);
                const price = product.prices[currentCurrency];
                const subtotal = price * item.quantity;
                
                return `
                    <div class="cart-item">
                        <div class="cart-item-image">
                            ${product.image ? `<img src="${product.image}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">` : `<i class="fa ${product.icon || 'fa-box'}"></i>`}
                        </div>
                        <div class="cart-item-details">
                            <div class="cart-item-name">${product.name}</div>
                            <div class="cart-item-price">${price} ${currentCurrency}</div>
                            <div>Cantidad: ${item.quantity}</div>
                            <div style="font-weight: 600; color: #0052cc; margin-top: 0.3rem;">
                                ${(subtotal).toFixed(2)} ${currentCurrency}
                            </div>
                            <button class="cart-item-remove" onclick="removeFromCart(${product.id})">
                                Eliminar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('btnCheckout').disabled = false;
        }

        // Actualizar totales
        let total = 0;
        cart.forEach(item => {
            const product = products.find(p => p.id === item.id);
            const price = product.prices[currentCurrency];
            total += price * item.quantity;
        });

        document.getElementById('subtotalDisplay').textContent = `${total.toFixed(2)} ${currentCurrency}`;
        document.getElementById('totalDisplay').textContent = `${total.toFixed(2)} ${currentCurrency}`;
        document.getElementById('currencyDisplay').textContent = currentCurrency;
    }

    function showNotification(message) {
        const notification = document.createElement('div');
        notification.style.cssText = `
            position: fixed;
            top: 80px;
            right: 20px;
            background: #00aa00;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        `;
        notification.textContent = message;
        document.body.appendChild(notification);
        
        setTimeout(() => {
            notification.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => notification.remove(), 300);
        }, 2000);
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(400px); opacity: 0; }
        }
    `;
    document.head.appendChild(style);

    // Inicializar
    updateCartBadge();
    renderTienda();
    document.getElementById('currencySelect').value = currentCurrency;
</script>

</body>
</html>
